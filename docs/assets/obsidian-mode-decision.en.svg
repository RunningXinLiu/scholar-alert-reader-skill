<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font: 700 40px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; fill: #0f172a; }
      .label { font: 600 24px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; fill: #0f172a; }
      .small { font: 500 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; fill: #334155; }
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 18; ry: 18; }
      .good { fill: #ecfeff; stroke: #22d3ee; }
      .warn { fill: #fff7ed; stroke: #fb923c; }
      .strong { fill: #ecfdf5; stroke: #34d399; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .tag { font: 700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; fill: #0f172a; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff" />
  <text x="70" y="90" class="title">Obsidian Export Mode Decision (Clean-First)</text>
  <text x="70" y="130" class="small">Daily workflow: prefer clean. Full is explicit and separate.</text>

  <rect x="80" y="190" width="360" height="110" class="box" />
  <text x="260" y="245" class="label" text-anchor="middle">Need notes in Obsidian</text>

  <rect x="520" y="170" width="520" height="150" class="box warn" />
  <text x="780" y="228" class="label" text-anchor="middle">Do you only want selected papers?</text>
  <text x="780" y="268" class="small" text-anchor="middle">Must read + interested only</text>

  <rect x="1160" y="130" width="360" height="110" class="box strong" />
  <text x="1340" y="188" class="label" text-anchor="middle">Use clean (default)</text>

  <rect x="1160" y="290" width="360" height="130" class="box warn" />
  <text x="1340" y="348" class="label" text-anchor="middle">Use --obsidian-mode full</text>
  <text x="1340" y="384" class="small" text-anchor="middle">Debug / archive / full generated reports</text>

  <rect x="470" y="420" width="620" height="140" class="box" />
  <text x="780" y="480" class="label" text-anchor="middle">Same folder previously used full mode?</text>
  <text x="780" y="520" class="small" text-anchor="middle">If yes, migrate conservatively first</text>

  <rect x="140" y="620" width="520" height="130" class="box good" />
  <text x="400" y="680" class="label" text-anchor="middle">Run clean + --no-prune once</text>
  <text x="400" y="716" class="small" text-anchor="middle">Keep old full artifacts untouched</text>

  <rect x="760" y="620" width="520" height="130" class="box strong" />
  <text x="1020" y="680" class="label" text-anchor="middle">Run clean (no flag)</text>
  <text x="1020" y="716" class="small" text-anchor="middle">Prune manifest-marked old full artifacts</text>

  <line x1="440" y1="245" x2="520" y2="245" class="arrow" />
  <line x1="1040" y1="215" x2="1160" y2="185" class="arrow" />
  <line x1="1040" y1="275" x2="1160" y2="355" class="arrow" />
  <line x1="1340" y1="240" x2="1340" y2="560" class="arrow" />
  <line x1="1340" y1="560" x2="1020" y2="620" class="arrow" />
  <line x1="780" y1="320" x2="780" y2="420" class="arrow" />
  <line x1="660" y1="560" x2="400" y2="620" class="arrow" />
  <line x1="900" y1="560" x2="1020" y2="620" class="arrow" />

  <text x="1075" y="200" class="tag">YES</text>
  <text x="1060" y="315" class="tag">NO</text>
  <text x="590" y="602" class="tag">YES</text>
  <text x="915" y="602" class="tag">NO</text>
</svg>
