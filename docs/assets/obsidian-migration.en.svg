<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font: 700 40px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; fill: #0f172a; }
      .label { font: 600 24px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; fill: #0f172a; }
      .small { font: 500 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; fill: #334155; }
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 16; ry: 16; }
      .good { fill: #ecfeff; stroke: #22d3ee; }
      .safe { fill: #ecfdf5; stroke: #34d399; }
      .warn { fill: #fff7ed; stroke: #fb923c; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .tag { font: 700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; fill: #0f172a; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff" />
  <text x="70" y="90" class="title">Migration: Old Full Folder to Clean Inbox</text>
  <text x="70" y="130" class="small">A conservative path that prevents accidental data loss.</text>

  <rect x="80" y="190" width="420" height="110" class="box warn" />
  <text x="290" y="248" class="label" text-anchor="middle">Existing folder has full outputs</text>

  <rect x="600" y="170" width="520" height="150" class="box good" />
  <text x="860" y="230" class="label" text-anchor="middle">Run clean + --no-prune first</text>
  <text x="860" y="270" class="small" text-anchor="middle">Export selected notes, keep old full artifacts</text>

  <rect x="1220" y="190" width="300" height="110" class="box safe" />
  <text x="1370" y="248" class="label" text-anchor="middle">Review notes</text>

  <rect x="560" y="420" width="600" height="150" class="box" />
  <text x="860" y="480" class="label" text-anchor="middle">Do you still need old full artifacts?</text>
  <text x="860" y="520" class="small" text-anchor="middle">Dashboard / maps / answers / deep-read indexes</text>

  <rect x="220" y="660" width="520" height="130" class="box warn" />
  <text x="480" y="718" class="label" text-anchor="middle">Keep using clean + --no-prune</text>
  <text x="480" y="754" class="small" text-anchor="middle">Maximum preservation, no cleanup</text>

  <rect x="860" y="660" width="520" height="130" class="box safe" />
  <text x="1120" y="718" class="label" text-anchor="middle">Run clean (no --no-prune)</text>
  <text x="1120" y="754" class="small" text-anchor="middle">Prune manifest-marked full artifacts safely</text>

  <line x1="500" y1="245" x2="600" y2="245" class="arrow" />
  <line x1="1120" y1="245" x2="1220" y2="245" class="arrow" />
  <line x1="1370" y1="300" x2="980" y2="420" class="arrow" />
  <line x1="740" y1="570" x2="480" y2="660" class="arrow" />
  <line x1="980" y1="570" x2="1120" y2="660" class="arrow" />

  <text x="690" y="640" class="tag">YES</text>
  <text x="1030" y="640" class="tag">NO</text>
</svg>
